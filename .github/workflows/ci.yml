name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PIP_FIND_LINKS: file://${{ github.workspace }}/mobile/p4a-wheels

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # LFS disabled: dist/momentum is rebuilt by PyInstaller each run;
          # fetching the committed LFS object drains the account bandwidth budget.
          lfs: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --with dev

      - name: Build Cython extensions
        run: |
          poetry run pip install --upgrade setuptools wheel
          poetry run python setup.py build_ext --inplace

      - name: Lint
        run: poetry run ruff check momentum/ tests/

      - name: Test with coverage
        env:
          MPLBACKEND: Agg
        run: poetry run pytest tests/ --cov=momentum --cov-report=term-missing --cov-fail-under=70 -q

  build:
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: momentum-linux
            separator: ":"
          - os: macos-latest
            artifact: momentum-macos
            separator: ":"
          - os: windows-latest
            artifact: momentum-windows
            separator: ";"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          # LFS disabled: dist/momentum is rebuilt by PyInstaller each run;
          # fetching the committed LFS object drains the account bandwidth budget.
          lfs: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --with dev

      - name: Build Cython extensions
        run: |
          poetry run pip install --upgrade setuptools wheel
          poetry run python setup.py build_ext --inplace

      - name: Stamp desktop build identity
        shell: bash
        run: |
          printf 'BUILD_NUMBER = %s\nBUILD_VARIANT = "cpu"\n' "$GITHUB_RUN_NUMBER" > momentum/build_info.py

      - name: Build standalone binary
        shell: bash
        run: |
          poetry run pyinstaller \
            --onefile \
            --name momentum \
            --add-data "ENCOURAGEMENTS.md${{ matrix.separator }}." \
            --add-data "IMAGES.md${{ matrix.separator }}." \
            --hidden-import momentum \
            --hidden-import PIL._tkinter_finder \
            --clean \
            momentum/cli.py

      - name: Verify binary runs
        shell: bash
        run: |
          if [ -f dist/momentum.exe ]; then
            dist/momentum.exe --help
          else
            dist/momentum --help
          fi

      - name: Build .deb package (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev
          sudo gem install fpm

          VERSION=$(pip install poetry > /dev/null 2>&1; poetry version -s)

          # Create staging directory
          mkdir -p deb-staging/usr/local/bin
          mkdir -p deb-staging/usr/local/share/momentum
          mkdir -p deb-staging/usr/share/applications

          cp dist/momentum deb-staging/usr/local/bin/momentum
          chmod 755 deb-staging/usr/local/bin/momentum
          cp ENCOURAGEMENTS.md deb-staging/usr/local/share/momentum/
          cp IMAGES.md deb-staging/usr/local/share/momentum/

          cat > deb-staging/usr/share/applications/momentum.desktop <<EOF
          [Desktop Entry]
          Name=Momentum
          Comment=A gentle tool for executive dysfunction support
          Exec=/usr/local/bin/momentum gui
          Type=Application
          Categories=Utility;
          Terminal=false
          EOF
          # Strip leading whitespace from heredoc
          sed -i 's/^          //' deb-staging/usr/share/applications/momentum.desktop

          fpm -s dir -t deb \
            -n momentum \
            -v "$VERSION" \
            --description "A gentle CLI and GUI tool to help people with executive dysfunction get back on track" \
            --maintainer "Robin Öberg <robinoberg@live.com>" \
            --url "https://github.com/yidaki53/momentum" \
            --license MIT \
            --depends python3-tk \
            -C deb-staging \
            -p "momentum_${VERSION}_amd64.deb" \
            .

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p artifacts
          if [ -f dist/momentum.exe ]; then
            cp dist/momentum.exe "artifacts/${{ matrix.artifact }}.exe"
          else
            cp dist/momentum "artifacts/${{ matrix.artifact }}"
          fi
          # Include .deb if it was built
          if ls momentum_*.deb 1>/dev/null 2>&1; then
            cp momentum_*.deb artifacts/
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/

  build-apk:
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libffi-dev libssl-dev \
            autoconf automake libtool libltdl-dev pkg-config zlib1g-dev \
            unzip zip

      - name: Install buildozer, Cython, and python-for-android
        run: |
          pip install buildozer cython==0.29.36 python-for-android

      - name: Install Android NDK 25b and platform API 34
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools/latest/bin
          yes | sdkmanager --sdk_root=$ANDROID_HOME \
            "ndk;25b" \
            "platform-tools" \
            "platforms;android-34" || true
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25b" >> $GITHUB_ENV
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/25b" >> $GITHUB_ENV
          echo "$ANDROID_HOME/ndk/25b" >> $GITHUB_PATH

      - name: Create mobile symlinks
        run: |
          cd mobile
          ln -sfn ../momentum momentum
          ln -sfn ../ENCOURAGEMENTS.md ENCOURAGEMENTS.md
          ln -sfn ../SCIENCE.md SCIENCE.md
          ln -sfn ../README.md README.md
          ln -sfn ../IMAGES.md IMAGES.md

      # NEVER change the signing keystore/alias for this app. Android refuses
      # to install an update whose signature differs from the installed one,
      # forcing users to uninstall first — which wipes app-private data
      # (tasks, test results) unless Google's Auto Backup happens to restore
      # it. Every APK/AAB ever shipped must keep signing with this same key.
      # (Both build-apk and build-apk-vulkan must use the identical keystore.)

      - name: Prepare Android signing keystore
        env:
          ANDROID_UPLOAD_KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
          ANDROID_RELEASE_KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          KEYSTORE_B64="${ANDROID_UPLOAD_KEYSTORE_B64:-${ANDROID_RELEASE_KEYSTORE_B64:-}}"
          if [ -z "${KEYSTORE_B64}" ]; then
            echo "Missing required secret: ANDROID_UPLOAD_KEYSTORE_B64 (preferred) or ANDROID_RELEASE_KEYSTORE_B64 (legacy)." >&2
            exit 1
          fi
          mkdir -p mobile/.ci

          # Decode robustly: tolerate wrapped/urlsafe/missing-padding base64 while
          # still validating content before writing the keystore.
          export KEYSTORE_B64
          python -c "import base64,os,re; raw=os.environ.get('KEYSTORE_B64',''); clean=re.sub(r'\\s+','',raw).replace('-','+').replace('_','/'); clean += '='*((4-len(clean)%4)%4); open('mobile/.ci/release.keystore','wb').write(base64.b64decode(clean, validate=True))" || {
            echo "Android upload/release keystore secret is not valid base64 after normalization." >&2
            exit 1
          }

          if [ ! -s mobile/.ci/release.keystore ]; then
            echo "Decoded Android keystore is empty or unreadable" >&2
            exit 1
          fi

      - name: Validate Android signing configuration
        env:
          P4A_RELEASE_KEYSTORE: ${{ github.workspace }}/mobile/.ci/release.keystore
          ANDROID_UPLOAD_KEYSTORE_PASSWD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWD }}
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWD }}
          ANDROID_UPLOAD_KEYALIAS: ${{ secrets.ANDROID_UPLOAD_KEYALIAS }}
          P4A_RELEASE_KEYALIAS: ${{ secrets.ANDROID_RELEASE_KEYALIAS }}
          ANDROID_UPLOAD_KEYALIAS_PASSWD: ${{ secrets.ANDROID_UPLOAD_KEYALIAS_PASSWD }}
          P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.ANDROID_RELEASE_KEYALIAS_PASSWD }}
        run: |
          set -euo pipefail

          P4A_RELEASE_KEYSTORE_PASSWD="${ANDROID_UPLOAD_KEYSTORE_PASSWD:-${P4A_RELEASE_KEYSTORE_PASSWD:-}}"
          P4A_RELEASE_KEYALIAS="${ANDROID_UPLOAD_KEYALIAS:-${P4A_RELEASE_KEYALIAS:-}}"
          P4A_RELEASE_KEYALIAS_PASSWD="${ANDROID_UPLOAD_KEYALIAS_PASSWD:-${P4A_RELEASE_KEYALIAS_PASSWD:-}}"

          if [ -z "${P4A_RELEASE_KEYSTORE_PASSWD}" ] || [ -z "${P4A_RELEASE_KEYALIAS}" ] || [ -z "${P4A_RELEASE_KEYALIAS_PASSWD}" ]; then
            echo "Missing required Android signing secrets: ANDROID_UPLOAD_KEYSTORE_PASSWD, ANDROID_UPLOAD_KEYALIAS, ANDROID_UPLOAD_KEYALIAS_PASSWD (preferred) or ANDROID_RELEASE_* (legacy)." >&2
            exit 1
          fi

          # Step 1: verify the keystore opens with the store password
          if ! keytool -list \
            -keystore "${P4A_RELEASE_KEYSTORE}" \
            -storepass "${P4A_RELEASE_KEYSTORE_PASSWD}" \
            >/tmp/android-signing-check.log 2>&1; then
            echo "Android signing preflight failed: cannot open keystore with ANDROID_UPLOAD_KEYSTORE_PASSWD (or legacy ANDROID_RELEASE_KEYSTORE_PASSWD)." >&2
            cat /tmp/android-signing-check.log >&2
            exit 1
          fi

          # Step 2: verify the alias exists in the keystore
          if ! grep -q "${P4A_RELEASE_KEYALIAS}" /tmp/android-signing-check.log; then
            echo "Android signing preflight failed: alias '${P4A_RELEASE_KEYALIAS}' not found in keystore. Check ANDROID_UPLOAD_KEYALIAS (or legacy ANDROID_RELEASE_KEYALIAS)." >&2
            cat /tmp/android-signing-check.log >&2
            exit 1
          fi

          # Step 3: verify the key entry password by performing an actual private-key
          # export (keytool -list silently ignores -keypass and cannot catch a bad key
          # entry password -- only operations that decrypt the private key can).
          if ! keytool -importkeystore \
            -srckeystore "${P4A_RELEASE_KEYSTORE}" \
            -srcstorepass "${P4A_RELEASE_KEYSTORE_PASSWD}" \
            -srcalias "${P4A_RELEASE_KEYALIAS}" \
            -srckeypass "${P4A_RELEASE_KEYALIAS_PASSWD}" \
            -destkeystore /tmp/android-signing-verify.p12 \
            -deststorepass "ci_verify_tmp" \
            -destkeypass "ci_verify_tmp" \
            -deststoretype pkcs12 \
            -noprompt \
            >/tmp/android-keypass-check.log 2>&1; then
            echo "Android signing preflight failed: cannot decrypt key entry with ANDROID_UPLOAD_KEYALIAS_PASSWD (or legacy ANDROID_RELEASE_KEYALIAS_PASSWD)." >&2
            echo "This is the root cause of 'Given final block not properly padded' during Gradle packageRelease." >&2
            echo "Fix: update ANDROID_UPLOAD_KEYALIAS_PASSWD in GitHub secrets (or legacy ANDROID_RELEASE_KEYALIAS_PASSWD) to the key entry password used when the keystore was created." >&2
            echo "Note: many Android keystores use the same password for both the store and the key entry." >&2
            cat /tmp/android-keypass-check.log >&2
            exit 1
          fi
          rm -f /tmp/android-signing-verify.p12

          echo "Android signing preflight passed for alias ${P4A_RELEASE_KEYALIAS} (store password and key entry password both verified)."

      - name: Stamp CPU build identity
        run: |
          printf 'BUILD_NUMBER = %s\nBUILD_VARIANT = "cpu"\n' "$GITHUB_RUN_NUMBER" > momentum/build_info.py

      - name: Build APK
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/25b
          ANDROID_NDK: /usr/local/lib/android/sdk/ndk/25b
          ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/25b
          P4A_RELEASE_KEYSTORE: ${{ github.workspace }}/mobile/.ci/release.keystore
          ANDROID_UPLOAD_KEYSTORE_PASSWD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWD }}
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWD }}
          ANDROID_UPLOAD_KEYALIAS: ${{ secrets.ANDROID_UPLOAD_KEYALIAS }}
          P4A_RELEASE_KEYALIAS: ${{ secrets.ANDROID_RELEASE_KEYALIAS }}
          ANDROID_UPLOAD_KEYALIAS_PASSWD: ${{ secrets.ANDROID_UPLOAD_KEYALIAS_PASSWD }}
          P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.ANDROID_RELEASE_KEYALIAS_PASSWD }}
        run: |
          set -euo pipefail

          P4A_RELEASE_KEYSTORE_PASSWD="${ANDROID_UPLOAD_KEYSTORE_PASSWD:-${P4A_RELEASE_KEYSTORE_PASSWD:-}}"
          P4A_RELEASE_KEYALIAS="${ANDROID_UPLOAD_KEYALIAS:-${P4A_RELEASE_KEYALIAS:-}}"
          P4A_RELEASE_KEYALIAS_PASSWD="${ANDROID_UPLOAD_KEYALIAS_PASSWD:-${P4A_RELEASE_KEYALIAS_PASSWD:-}}"

          if [ -z "${P4A_RELEASE_KEYSTORE_PASSWD}" ] || [ -z "${P4A_RELEASE_KEYALIAS}" ] || [ -z "${P4A_RELEASE_KEYALIAS_PASSWD}" ]; then
            echo "Missing required Android signing secrets: ANDROID_UPLOAD_KEYSTORE_PASSWD, ANDROID_UPLOAD_KEYALIAS, ANDROID_UPLOAD_KEYALIAS_PASSWD (preferred) or ANDROID_RELEASE_* (legacy)." >&2
            exit 1
          fi
          cd mobile
          ANDROID_NUMERIC_VERSION=$((100000000 + GITHUB_RUN_NUMBER))
          # Override build_dir for CI (no USB stick)
          sed -i 's|^build_dir.*|build_dir = /tmp/buildozer-build|' buildozer.spec
          sed -i 's|^android.release_artifact.*|android.release_artifact = apk|' buildozer.spec
          sed -i "s|^android.numeric_version.*|android.numeric_version = ${ANDROID_NUMERIC_VERSION}|" buildozer.spec

          # Pass 1: buildozer clones python-for-android fresh from GitHub (ignoring
          # p4a.source) and runs 'git checkout v1.26.4' via the numpy==v1.26.4 pin in
          # buildozer.spec. Pass 1 is expected to fail when numpy compiles because
          # hostpython3's isolated site-packages doesn't have Cython yet -- but it
          # clones p4a, checks out numpy, and builds hostpython3.
          buildozer android release > /tmp/buildozer-pass1.log 2>&1 || true
          tail -40 /tmp/buildozer-pass1.log || true

          # Fallback: if p4a rejected/normalised the v1.26.4 pin (pathspec or version
          # error), patch the CLONED p4a's numpy recipe to force version 'v1.26.4' and
          # unpin numpy so pass 2 uses the recipe version instead of the pin.
          # buildozer clones p4a into /tmp/buildozer-build/android/platform/python-for-android/.
          CLONED_P4A="/tmp/buildozer-build/android/platform/python-for-android"
          CLONED_NUMPY_RECIPE="${CLONED_P4A}/pythonforandroid/recipes/numpy/__init__.py"
          if [ -f "$CLONED_NUMPY_RECIPE" ] && grep -qiE "pathspec|did not match any file|InvalidVersion" /tmp/buildozer-pass1.log; then
            echo "Pass 1 hit a numpy version/checkout error -- applying cloned-recipe fallback."
            echo "Recipe before patch:"
            grep -E "version" "$CLONED_NUMPY_RECIPE" | head -5 || true
            sed -i -E 's/^([[:space:]]*version[[:space:]]*=).*/\1"v1.26.4"/' "$CLONED_NUMPY_RECIPE"
            if grep -q 'version = "v1.26.4"' "$CLONED_NUMPY_RECIPE"; then
              echo "Recipe after patch:"
              grep -E "version" "$CLONED_NUMPY_RECIPE" | head -5 || true
              sed -i 's|numpy==v1.26.4|numpy|' buildozer.spec
              echo "Unpinned numpy in buildozer.spec for pass 2 (recipe version v1.26.4 will be used):"
              grep -E "^requirements" buildozer.spec || true
            else
              echo "Recipe version line not found; keeping numpy==v1.26.4 pin for pass 2."
            fi
          else
            echo "No numpy version/checkout error detected in pass 1; keeping numpy==v1.26.4 pin for pass 2."
                    fi

          # Inject Cython into hostpython3's isolated site-packages (created by pass 1)
          HP_SITE="/tmp/buildozer-build/android/platform/build-arm64-v8a_armeabi-v7a/build/other_builds/hostpython3/desktop/hostpython3/native-build/Lib/site-packages"
          mkdir -p "$HP_SITE"
          pip install --target="$HP_SITE" Cython==0.29.36

          # Patch the cloned p4a: make the recipe venv's `pip install -U pip`
          # upgrade non-fatal. A partially-upgraded pip (mixed dist-infos) raises
          # ImportError and aborts the build here; the bundled pip is still usable.
          CLONED_P4A="/tmp/buildozer-build/android/platform/python-for-android"
          P4A_PATCH="$GITHUB_WORKSPACE/mobile/patches/p4a-venv-pip-fallback.patch"
          if [ -f "$P4A_PATCH" ]; then
            echo "Applying p4a venv-pip-fallback patch (non-fatal pip upgrade):"
            git -C "$CLONED_P4A" apply -v "$P4A_PATCH" && echo "Patch applied." \
              || { echo "Patch failed (already applied or context changed); continuing." >&2; }
          fi

          # Pass 2: numpy checkout cached from pass 1, Cython now available.
          # Tolerate failure so the llama-cpp-python recipe fallback below can run.
          set +e
          buildozer android release > /tmp/buildozer-pass2.log 2>&1
          PASS2_EXIT=$?
          set -e
          tail -60 /tmp/buildozer-pass2.log || true

          # The build must succeed with llama-cpp-python included -- no fallback
          # to a build without on-device inference. If pass 2 failed, re-run to
          # surface the real error.
          if [ "$PASS2_EXIT" -ne 0 ]; then
            echo "Pass 2 failed; re-running to surface the real error." >&2
            cat /tmp/buildozer-pass2.log >&2
            buildozer android release
          fi

      - name: Build AAB
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/25b
          ANDROID_NDK: /usr/local/lib/android/sdk/ndk/25b
          ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/25b
          P4A_RELEASE_KEYSTORE: ${{ github.workspace }}/mobile/.ci/release.keystore
          ANDROID_UPLOAD_KEYSTORE_PASSWD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWD }}
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWD }}
          ANDROID_UPLOAD_KEYALIAS: ${{ secrets.ANDROID_UPLOAD_KEYALIAS }}
          P4A_RELEASE_KEYALIAS: ${{ secrets.ANDROID_RELEASE_KEYALIAS }}
          ANDROID_UPLOAD_KEYALIAS_PASSWD: ${{ secrets.ANDROID_UPLOAD_KEYALIAS_PASSWD }}
          P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.ANDROID_RELEASE_KEYALIAS_PASSWD }}
        run: |
          set -euo pipefail

          P4A_RELEASE_KEYSTORE_PASSWD="${ANDROID_UPLOAD_KEYSTORE_PASSWD:-${P4A_RELEASE_KEYSTORE_PASSWD:-}}"
          P4A_RELEASE_KEYALIAS="${ANDROID_UPLOAD_KEYALIAS:-${P4A_RELEASE_KEYALIAS:-}}"
          P4A_RELEASE_KEYALIAS_PASSWD="${ANDROID_UPLOAD_KEYALIAS_PASSWD:-${P4A_RELEASE_KEYALIAS_PASSWD:-}}"

          if [ -z "${P4A_RELEASE_KEYSTORE_PASSWD}" ] || [ -z "${P4A_RELEASE_KEYALIAS}" ] || [ -z "${P4A_RELEASE_KEYALIAS_PASSWD}" ]; then
            echo "Missing required Android signing secrets: ANDROID_UPLOAD_KEYSTORE_PASSWD, ANDROID_UPLOAD_KEYALIAS, ANDROID_UPLOAD_KEYALIAS_PASSWD (preferred) or ANDROID_RELEASE_* (legacy)." >&2
            exit 1
          fi
          cd mobile
          sed -i 's|^android.release_artifact.*|android.release_artifact = aab|' buildozer.spec
          # The AAB build must succeed with llama-cpp-python included.
          # If the build fails, re-run to surface the real error.
          set +e
          buildozer android release > /tmp/buildozer-aab.log 2>&1
          AAB_EXIT=$?
          set -e
          tail -60 /tmp/buildozer-aab.log || true
          if [ "$AAB_EXIT" -ne 0 ]; then
            echo "AAB build failed; re-running to surface the real error." >&2
            cat /tmp/buildozer-aab.log >&2
            buildozer android release
          fi

      - name: Collect build logs
        if: always()
        run: |
          mkdir -p android-build-logs
          cp /tmp/buildozer-pass1.log /tmp/buildozer-pass2.log /tmp/buildozer-aab.log android-build-logs/ 2>/dev/null || true

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: android-build-logs
          path: android-build-logs/
          if-no-files-found: ignore

      - name: Prepare APK artifact
        run: |
          mkdir -p artifacts
          APK_PATH=""
          for candidate in mobile/bin/*-release.apk mobile/bin/*.apk; do
            if [ -f "$candidate" ]; then
              APK_PATH="$candidate"
              break
            fi
          done
          if [ -z "$APK_PATH" ]; then
            echo "No APK build artifact found in mobile/bin" >&2
            exit 1
          fi
          cp "$APK_PATH" artifacts/momentum-android.apk
          python mobile/scripts/verify_coach_apk.py artifacts/momentum-android.apk

      - name: Prepare AAB artifact
        run: |
          mkdir -p artifacts
          AAB_PATH=""
          for candidate in mobile/bin/*-release.aab mobile/bin/*.aab; do
            if [ -f "$candidate" ]; then
              AAB_PATH="$candidate"
              break
            fi
          done
          if [ -z "$AAB_PATH" ]; then
            echo "No AAB build artifact found in mobile/bin" >&2
            exit 1
          fi
          cp "$AAB_PATH" artifacts/momentum-android.aab

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v5
        with:
          name: momentum-android
          path: |
            artifacts/momentum-android.apk
            artifacts/momentum-android.aab

  build-apk-vulkan:
    # Variant of build-apk that produces a SECOND APK with the Vulkan (GPU)
    # backend enabled for the on-device AI Coach. The llama-cpp-python recipe
    # (mobile/p4a-recipes/llama-cpp-python) is CPU-only by default and pulls a
    # prebuilt CPU wheel; setting GGML_VULKAN=ON makes the recipe skip the
    # prebuilt short-circuit and compile llama-cpp-python from source with
    # -DGGML_VULKAN=ON (and points CMake at the NDK Vulkan headers/lib via
    # VULKAN_SDK). NDK r25b ships vulkan/vulkan.h + libvulkan.so for aarch64.
    # By design this job does NOT build an AAB (the Vulkan variant is an
    # additional sideload artifact alongside the release APK/AAB).
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    # Advisory: the Vulkan variant only adds a sideload artifact, so a
    # Vulkan-only failure must not fail the workflow. Without this, that
    # failure makes the release job's implicit success() check false and the
    # release is skipped outright (seen on run 71), stopping every publish.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libffi-dev libssl-dev \
            autoconf automake libtool libltdl-dev pkg-config zlib1g-dev \
            unzip zip
      - name: Install Vulkan shader tooling (glslc + headers)
        run: |
          sudo apt-get update
          # glslang-tools provides the distro glslc fallback. vulkan-headers is
          # only the last-resort source of vulkan/vulkan.h for the header check
          # below; the recipe points CMake at the NDK's own copy via VULKAN_SDK.
          sudo apt-get install -y glslang-tools
          sudo apt-get install -y vulkan-headers libvulkan-dev || true

          # llama.cpp's Vulkan backend compiles its compute shaders with glslc.
          # Prefer the NDK-bundled shader-tools copy (it matches the NDK that
          # buildozer cross-compiles with), then fall back to the distro glslc
          # installed above. The recipe runs the same discovery for the build
          # environment, so failing here only fails fast.
          glslc_path=""
          for candidate in "$ANDROID_HOME"/ndk/*/shader-tools/linux-x86_64/glslc; do
            if [ -x "$candidate" ]; then
              echo "$(dirname "$candidate")" >> "$GITHUB_PATH"
              glslc_path="$candidate"
              break
            fi
          done
          if [ -z "$glslc_path" ] && command -v glslc >/dev/null 2>&1; then
            glslc_path="$(command -v glslc)"
          fi
          if [ -z "$glslc_path" ]; then
            echo "glslc missing: cannot compile llama.cpp Vulkan shaders" >&2
            exit 1
          fi
          echo "Using glslc: $glslc_path"
          "$glslc_path" --version | head -2

          # VULKAN_SDK points at the NDK's Vulkan sources, so the matching
          # vulkan/vulkan.h must exist for the cross-compile. NDK r25 ships it
          # under sources/third_party/, but newer NDKs (r27+, which GH runners
          # preinstall) only carry it inside the sysroot - accept both, then
          # the distro headers, so bumping android.ndk does not break this
          # check.
          header=""
          for candidate in "$ANDROID_HOME"/ndk/*/sources/third_party/vulkan/src/include/vulkan/vulkan.h \
                           "$ANDROID_HOME"/ndk/*/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include/vulkan/vulkan.h \
                           /usr/include/vulkan/vulkan.h; do
            if [ -f "$candidate" ]; then
              header="$candidate"
              break
            fi
          done
          if [ -z "$header" ]; then
            echo "NDK Vulkan headers missing" >&2
            exit 1
          fi
          echo "Using Vulkan headers: $header"
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      - name: Install buildozer, Cython, and python-for-android
        run: |
          pip install buildozer cython==0.29.36 python-for-android

      - name: Install Android NDK 25b and platform API 34
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools/latest/bin
          yes | sdkmanager --sdk_root=$ANDROID_HOME \
            "ndk;25b" \
            "platform-tools" \
            "platforms;android-34" || true
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25b" >> $GITHUB_ENV
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/25b" >> $GITHUB_ENV
          echo "$ANDROID_HOME/ndk/25b" >> $GITHUB_PATH

      - name: Create mobile symlinks
        run: |
          cd mobile
          ln -sfn ../momentum momentum
          ln -sfn ../ENCOURAGEMENTS.md ENCOURAGEMENTS.md
          ln -sfn ../SCIENCE.md SCIENCE.md
          ln -sfn ../README.md README.md
          ln -sfn ../IMAGES.md IMAGES.md

      - name: Prepare Android signing keystore
        env:
          ANDROID_UPLOAD_KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
          ANDROID_RELEASE_KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          KEYSTORE_B64="${ANDROID_UPLOAD_KEYSTORE_B64:-${ANDROID_RELEASE_KEYSTORE_B64:-}}"
          if [ -z "${KEYSTORE_B64}" ]; then
            echo "Missing required secret: ANDROID_UPLOAD_KEYSTORE_B64 (preferred) or ANDROID_RELEASE_KEYSTORE_B64 (legacy)." >&2
            exit 1
          fi
          mkdir -p mobile/.ci
          export KEYSTORE_B64
          python -c "import base64,os,re; raw=os.environ.get('KEYSTORE_B64',''); clean=re.sub(r'\s+','',raw).replace('-','+').replace('_','/'); clean += '='*((4-len(clean)%4)%4); open('mobile/.ci/release.keystore','wb').write(base64.b64decode(clean, validate=True))" || {
            echo "Android upload/release keystore secret is not valid base64 after normalization." >&2
            exit 1
          }
          if [ ! -s mobile/.ci/release.keystore ]; then
            echo "Decoded Android keystore is empty or unreadable" >&2
            exit 1
          fi

      - name: Validate Android signing configuration
        env:
          P4A_RELEASE_KEYSTORE: ${{ github.workspace }}/mobile/.ci/release.keystore
          ANDROID_UPLOAD_KEYSTORE_PASSWD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWD }}
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWD }}
          ANDROID_UPLOAD_KEYALIAS: ${{ secrets.ANDROID_UPLOAD_KEYALIAS }}
          P4A_RELEASE_KEYALIAS: ${{ secrets.ANDROID_RELEASE_KEYALIAS }}
          ANDROID_UPLOAD_KEYALIAS_PASSWD: ${{ secrets.ANDROID_UPLOAD_KEYALIAS_PASSWD }}
          P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.ANDROID_RELEASE_KEYALIAS_PASSWD }}
        run: |
          set -euo pipefail
          P4A_RELEASE_KEYSTORE_PASSWD="${ANDROID_UPLOAD_KEYSTORE_PASSWD:-${P4A_RELEASE_KEYSTORE_PASSWD:-}}"
          P4A_RELEASE_KEYALIAS="${ANDROID_UPLOAD_KEYALIAS:-${P4A_RELEASE_KEYALIAS:-}}"
          P4A_RELEASE_KEYALIAS_PASSWD="${ANDROID_UPLOAD_KEYALIAS_PASSWD:-${P4A_RELEASE_KEYALIAS_PASSWD:-}}"
          if [ -z "${P4A_RELEASE_KEYSTORE_PASSWD}" ] || [ -z "${P4A_RELEASE_KEYALIAS}" ] || [ -z "${P4A_RELEASE_KEYALIAS_PASSWD}" ]; then
            echo "Missing required Android signing secrets: ANDROID_UPLOAD_KEYSTORE_PASSWD, ANDROID_UPLOAD_KEYALIAS, ANDROID_UPLOAD_KEYALIAS_PASSWD (preferred) or ANDROID_RELEASE_* (legacy)." >&2
            exit 1
          fi
          if ! keytool -list \
            -keystore "${P4A_RELEASE_KEYSTORE}" \
            -storepass "${P4A_RELEASE_KEYSTORE_PASSWD}" \
            >/tmp/android-signing-check-vulkan.log 2>&1; then
            echo "Android signing preflight failed: cannot open keystore." >&2
            cat /tmp/android-signing-check-vulkan.log >&2
            exit 1
          fi
          if ! grep -q "${P4A_RELEASE_KEYALIAS}" /tmp/android-signing-check-vulkan.log; then
            echo "Android signing preflight failed: alias '${P4A_RELEASE_KEYALIAS}' not found in keystore." >&2
            cat /tmp/android-signing-check-vulkan.log >&2
            exit 1
          fi
          if ! keytool -importkeystore \
            -srckeystore "${P4A_RELEASE_KEYSTORE}" \
            -srcstorepass "${P4A_RELEASE_KEYSTORE_PASSWD}" \
            -srcalias "${P4A_RELEASE_KEYALIAS}" \
            -srckeypass "${P4A_RELEASE_KEYALIAS_PASSWD}" \
            -destkeystore /tmp/android-signing-verify-vulkan.p12 \
            -deststorepass "ci_verify_tmp" -destkeypass "ci_verify_tmp" \
            -deststoretype pkcs12 -noprompt \
            >/tmp/android-keypass-check-vulkan.log 2>&1; then
            echo "Android signing preflight failed: cannot decrypt key entry." >&2
            cat /tmp/android-keypass-check-vulkan.log >&2
            exit 1
          fi
          rm -f /tmp/android-signing-verify-vulkan.p12
          echo "Android signing preflight passed for alias ${P4A_RELEASE_KEYALIAS} (store password and key entry password both verified)."
      - name: Stamp Vulkan build identity
        run: |
          printf 'BUILD_NUMBER = %s\nBUILD_VARIANT = "vulkan"\n' "$GITHUB_RUN_NUMBER" > momentum/build_info.py

      - name: Build APK with Vulkan
        env:
          # KEY difference from build-apk: enables the Vulkan backend in the
          # llama-cpp-python recipe, which also skips the prebuilt CPU wheel
          # in favor of a source build.
          GGML_VULKAN: "ON"
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/25b
          ANDROID_NDK: /usr/local/lib/android/sdk/ndk/25b
          ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/25b
          P4A_RELEASE_KEYSTORE: ${{ github.workspace }}/mobile/.ci/release.keystore
          ANDROID_UPLOAD_KEYSTORE_PASSWD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWD }}
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWD }}
          ANDROID_UPLOAD_KEYALIAS: ${{ secrets.ANDROID_UPLOAD_KEYALIAS }}
          P4A_RELEASE_KEYALIAS: ${{ secrets.ANDROID_RELEASE_KEYALIAS }}
          ANDROID_UPLOAD_KEYALIAS_PASSWD: ${{ secrets.ANDROID_UPLOAD_KEYALIAS_PASSWD }}
          P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.ANDROID_RELEASE_KEYALIAS_PASSWD }}
        run: |
          set -euo pipefail
          P4A_RELEASE_KEYSTORE_PASSWD="${ANDROID_UPLOAD_KEYSTORE_PASSWD:-${P4A_RELEASE_KEYSTORE_PASSWD:-}}"
          P4A_RELEASE_KEYALIAS="${ANDROID_UPLOAD_KEYALIAS:-${P4A_RELEASE_KEYALIAS:-}}"
          P4A_RELEASE_KEYALIAS_PASSWD="${ANDROID_UPLOAD_KEYALIAS_PASSWD:-${P4A_RELEASE_KEYALIAS_PASSWD:-}}"
          if [ -z "${P4A_RELEASE_KEYSTORE_PASSWD}" ] || [ -z "${P4A_RELEASE_KEYALIAS}" ] || [ -z "${P4A_RELEASE_KEYALIAS_PASSWD}" ]; then
            echo "Missing required Android signing secrets." >&2
            exit 1
          fi
          cd mobile
          ANDROID_NUMERIC_VERSION=$((100000000 + GITHUB_RUN_NUMBER))
          # The GitHub Actions ubuntu-22.04 runner does not ship libvulkan-dev,
          # so /usr/include/vulkan/vulkan.hpp is absent at recipe runtime. Without
          # it, the llama-cpp-python recipe's vulkan.hpp detection (get_recipe_env)
          # prints "vulkan/vulkan.hpp not found" and skips adding
          # -DVulkan_INCLUDE_DIR / -DCMAKE_INCLUDE_PATH to cmake.args, and then
          # ggml-vulkan.cpp fails with "fatal error: 'vulkan/vulkan.hpp' file not
          # found" when it reaches the aarch64 target compile. Installing the distro
          # package makes the C++ Vulkan-Hpp header available so the recipe can hand
          # the include dir to CMake via the cmake.args config-setting.
          sudo apt-get update -qq
          sudo apt-get install -y -qq libvulkan-dev
          sed -i 's|^build_dir.*|build_dir = /tmp/buildozer-build-vulkan|' buildozer.spec
          sed -i 's|^android.release_artifact.*|android.release_artifact = apk|' buildozer.spec
          sed -i "s|^android.numeric_version.*|android.numeric_version = ${ANDROID_NUMERIC_VERSION}|" buildozer.spec
          # ggml-vulkan links against Vulkan 1.1 entry points. The NDK r25b
          # libvulkan.so import stub grows these incrementally:
          #   android-26/27 -> missing vkEnumerateInstanceVersion,
          #     vkGetPhysicalDeviceProperties2, vkGetPhysicalDeviceFeatures2,
          #     vkResetQueryPool;
          #   android-28     -> the first three resolve, but vkResetQueryPool
          #     is STILL absent (verified empirically on runs at minapi 28:
          #     "ld: error: undefined symbol: vkResetQueryPool");
          #   android-31     -> AOSP libvulkan.map.txt contains
          #     "vkResetQueryPool; # introduced=31" (absent from the API 29
          #     and 30 maps), so the android-31 stub finally exports it.
          # Raise minapi for the Vulkan variant only so the final
          # libggml-vulkan.so link resolves every symbol: buildozer derives
          # android.ndk_api from android.minapi, the recipe forwards it as
          # -DANDROID_PLATFORM=android-<api>, and the APK manifest then
          # declares minSdk 31 (the Vulkan APK needs Android 12+; older
          # devices use the CPU APK). android.api is 34 so 31 <= api holds.
          # The CPU job keeps 26 (prebuilt android_26 wheel).
          sed -i 's|^android.minapi.*|android.minapi = 31|' buildozer.spec
          grep -E '^android\.(minapi|api)' buildozer.spec
          # Pass 1: clones p4a + numpy (v1.26.4 pin) and builds hostpython3.
          # Expected to fail when numpy compiles (hostpython3 lacks Cython).
          buildozer android release > /tmp/buildozer-vulkan-pass1.log 2>&1 || true
          tail -40 /tmp/buildozer-vulkan-pass1.log || true
          CLONED_P4A="/tmp/buildozer-build-vulkan/android/platform/python-for-android"
          CLONED_NUMPY_RECIPE="${CLONED_P4A}/pythonforandroid/recipes/numpy/__init__.py"
          if [ -f "$CLONED_NUMPY_RECIPE" ] && grep -qiE "pathspec|did not match|InvalidVersion" /tmp/buildozer-vulkan-pass1.log; then
            echo "Pass 1 hit a numpy version/checkout error -- applying cloned-recipe fallback."
            grep -E "version" "$CLONED_NUMPY_RECIPE" | head -5 || true
            sed -i -E 's/^([[:space:]]*version[[:space:]]*=).*/\1"v1.26.4"/' "$CLONED_NUMPY_RECIPE"
            if grep -q 'version = "v1.26.4"' "$CLONED_NUMPY_RECIPE"; then
              grep -E "version" "$CLONED_NUMPY_RECIPE" | head -5 || true
              sed -i 's|numpy==v1.26.4|numpy|' buildozer.spec
              echo "Unpinned numpy in buildozer.spec for pass 2 (recipe v1.26.4 will be used):"
              grep -E "^requirements" buildozer.spec || true
            else
              echo "Recipe version line not found; keeping numpy==v1.26.4 pin."
            fi
          else
            echo "No numpy version/checkout error in pass 1; keeping numpy==v1.26.4 pin."
          fi
          HP_SITE="/tmp/buildozer-build-vulkan/android/platform/build-arm64-v8a/build/other_builds/hostpython3/desktop/hostpython3/native-build/Lib/site-packages"
          mkdir -p "$HP_SITE"
          pip install --target="$HP_SITE" Cython==0.29.36
          P4A_PATCH="${GITHUB_WORKSPACE}/mobile/patches/p4a-venv-pip-fallback.patch"
          if [ -f "$P4A_PATCH" ] && [ -d "$CLONED_P4A" ]; then
            echo "Applying p4a venv-pip-fallback patch:"
            git -C "$CLONED_P4A" apply -v "$P4A_PATCH" \
              && echo "Patch applied." \
              || { echo "Patch failed (already applied or context changed); continuing." >&2; }
          fi
          set +e
          buildozer android release > /tmp/buildozer-vulkan-pass2.log 2>&1
          PASS2_EXIT=$?
          set -e
          tail -60 /tmp/buildozer-vulkan-pass2.log || true
          if [ "$PASS2_EXIT" -ne 0 ]; then
            echo "Vulkan APK build failed; re-running to surface the real error." >&2
            cat /tmp/buildozer-vulkan-pass2.log >&2
            buildozer android release
          fi
      - name: Collect build logs
        if: always()
        run: |
          mkdir -p android-build-logs
          cp /tmp/buildozer-vulkan-pass1.log /tmp/buildozer-vulkan-pass2.log android-build-logs/ 2>/dev/null || true
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: android-vulkan-build-logs
          path: android-build-logs/
          if-no-files-found: ignore
      - name: Prepare APK artifact
        run: |
          mkdir -p artifacts
          APK_PATH=""
          for candidate in mobile/bin/*-release.apk mobile/bin/*.apk; do
            if [ -f "$candidate" ]; then
              APK_PATH="$candidate"
              break
            fi
          done
          if [ -z "$APK_PATH" ]; then
            echo "No APK build artifact found in mobile/bin" >&2
            exit 1
          fi
          cp "$APK_PATH" artifacts/momentum-android-vulkan.apk
          python mobile/scripts/verify_coach_apk.py artifacts/momentum-android-vulkan.apk --vulkan
      - name: Upload Android artifact (Vulkan)
        uses: actions/upload-artifact@v5
        with:
          name: momentum-android-vulkan
          path: |
            artifacts/momentum-android-vulkan.apk

  release:
    # Publishing gates on the tested CPU artifacts (build, build-apk) only.
    # build-apk-vulkan is advisory: it sets continue-on-error so its failure
    # result is not 'failure', but GitHub also ANDs an implicit success() over
    # every entry in needs, so always() is required here to keep an advisory
    # Vulkan failure from skipping the release and silently freezing updates.
    needs: [build, build-apk, build-apk-vulkan]
    if: >
      always() &&
      github.ref == 'refs/heads/master' && github.event_name == 'push' &&
      (needs.build.result == 'success' && needs.build-apk.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install poetry

      - name: Get version
        id: version
        run: echo "version=$(poetry version -s)" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-assets
          pattern: momentum-*
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}-build.${{ github.run_number }}
          name: Momentum v${{ steps.version.outputs.version }} (build ${{ github.run_number }})
          body: |
            Automated build from commit ${{ github.sha }}.

            Download the binary for your platform and run it directly -- no Python required.

            - **Linux**: `momentum-linux` (standalone binary) or `momentum_<version>_amd64.deb` (Debian/Ubuntu package)
            - **macOS**: `momentum-macos`
            - **Windows**: `momentum-windows.exe`
            - **Android sideload**: `momentum-android.apk`
            - **Android Vulkan (GPU) sideload**: `momentum-android-vulkan.apk`
            - **Android Play upload**: `momentum-android.aab`
          files: release-assets/*
          draft: false
          prerelease: false
