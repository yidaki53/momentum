# v12: SUPERVISED charter-coverage retrain. OPD is parked (STATUS.md 2026-10-09), so
# this is the corpus lever instead: same v9c recipe, new grounded corpus.
#
# Two decisions this config encodes, both deliberate:
#
# 1. HOLD-OUT CORPUS. data/synthetic/train-v11.jsonl is built by scripts/ground_charter.py
#    with --no-references: the 10 eval vignette prompts are NOT in training (the replay
#    drops them; the 20 paraphrases are collision-checked to never equal eval wording).
#    charter_substance is a GATED axis (min_score 0.8) judged on eval/asimov_vignettes.jsonl,
#    so training on those exact prompts would make the gate pass by memorisation. The
#    ground report records eval_prompts_in_training == [] -- read it, do not take this
#    comment's word for it. tests/test_distillation_bench.py::test_v12_corpus_holds_out_the
#    _eval_vignettes pins it.
#
# 2. CHARTER WEIGHT. v9c trained at a 14.0% charter share (90/645 after charter=8) and
#    scored charter 1.00; v8 collapsed activation 0.95 -> 0.40 at ~20% (charter 16x).
#    charter_grounded=4 (5 copies, 100/655 = 15.3%) sits at v9c's proven share and below
#    the v8 danger zone. The repeat key is "charter_grounded", NOT "charter": the held-out
#    corpus's kind names changed with the corpus, and a stale key would repeat nothing
#    while looking configured.
#
# LoRA settings are byte-identical to v9c (configs/retrain.v9c.toml) so the only variable
# is the corpus. tests/test_distillation_bench.py::test_v12_config_matches_v9c_on_lora_and
# _seed pins this; do not diverge them.

[student]
# Exactly what the app already ships today. Same tokenizer, same quantisation family.
model_id = "Qwen/Qwen2.5-0.5B-Instruct"
revision = "main"
registry_name = "momentum-qwen05b"

[teacher]
# Unused by train_distill.py (no KD tier -- see its module docstring). Kept identical so
# config diffs stay readable against the v9c lineage.
model_id = "Qwen/Qwen2.5-7B-Instruct"
revision = "main"
temperature = 1.0

[train]
method = "lora"
lora_r = 32
lora_alpha = 64
lora_dropout = 0.05
target_modules = ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
learning_rate = 2e-4
warmup_ratio = 0.03
epochs = 3
per_device_batch_size = 2
gradient_accumulation_steps = 8
max_seq_len = 640
seed = 20260901
bf16 = true
output_dir = "out/lora-v12"
# 12GB card: the logits tensor, not the weights, is what runs out of memory.
gradient_checkpointing = true

[train.repeat_kinds]
bounded = 2
substantive = 2
charter_grounded = 4

[merge]
output_dir = "out/student-v12"

[abliterate]
# Inert for train_distill.py (it stops after merge and prints the optional next step).
# Heretic has never been run; this means "permitted", not "run it" -- see STATUS.md Gap 3.
enabled = true
output_dir = "out/student-v12-abliterated"
config = "configs/heretic.momentum.toml"

[quantize]
primary = "Q4_K_M"
candidates = ["Q4_K_M", "Q3_K_M", "IQ2_XXS"]
output_dir = "out/gguf"

[seeds]
# This corpus is built by scripts/ground_charter.py, NOT build_distill_pairs.py. The
# include_* flags below are the v9c lineage's knobs and are inert for this run; they are
# kept only so a future regeneration does not silently diverge from the documented recipe.
# Regenerate with:
#   python scripts/ground_charter.py --no-references \
#     --out data/synthetic/train-v11.jsonl \
#     --report data/synthetic/train-v11.ground_report.json
output = "data/synthetic/train-v11.jsonl"
include_repair_pairs = true
include_charter_pairs = true
include_bounded_action_pairs = true
include_substantive_pairs = true
include_multiturn_episodes = true
turns_min = 3
turns_max = 6
